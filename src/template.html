<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="iPAS AI 應用規劃師（初級）歷屆公告試題與學習指引練習題刷題網站：練習模式、計時模擬考、錯題本與重點整理。">
<meta name="theme-color" content="#1D5C8C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231D5C8C'/%3E%3Ccircle cx='32' cy='32' r='16' fill='none' stroke='white' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='7' fill='white'/%3E%3C/svg%3E">
<style>[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>iPAS 初級刷題室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface2:#F6F8FA; --ink:#17212B; --muted:#5A6877; --line:#D3DAE1;
  --accent:#1D5C8C; --accent-ink:#FFFFFF; --accent-soft:#E0EBF4;
  --ok:#2A7A4B; --ok-soft:#E2F1E7; --bad:#B3372B; --bad-soft:#F8E3E0; --mark:#C98A12; --mark-soft:#FBF0D8;
  --shadow:0 1px 2px rgba(23,33,43,.06),0 4px 14px rgba(23,33,43,.05);
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1318; --surface:#161D24; --surface2:#1B242D; --ink:#E4EAF0; --muted:#94A3B2; --line:#2A3540;
    --accent:#5BA7DB; --accent-ink:#0B1520; --accent-soft:#17324A;
    --ok:#5CC08A; --ok-soft:#153325; --bad:#F07A6C; --bad-soft:#3A1C18; --mark:#E7B24A; --mark-soft:#3A2C10;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1318; --surface:#161D24; --surface2:#1B242D; --ink:#E4EAF0; --muted:#94A3B2; --line:#2A3540;
  --accent:#5BA7DB; --accent-ink:#0B1520; --accent-soft:#17324A;
  --ok:#5CC08A; --ok-soft:#153325; --bad:#F07A6C; --bad-soft:#3A1C18; --mark:#E7B24A; --mark-soft:#3A2C10;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7;margin:0}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{max-width:880px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{font-family:var(--serif);font-weight:900;font-size:19px;letter-spacing:.02em;white-space:nowrap}
.brand small{font-family:var(--sans);font-weight:500;font-size:12px;color:var(--muted);margin-left:8px;letter-spacing:.04em}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.tabs button{font:inherit;font-size:14px;border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:999px;cursor:pointer}
nav.tabs button[aria-current="true"]{background:var(--ink);color:var(--bg)}
nav.tabs button:hover:not([aria-current="true"]){background:var(--surface)}
button,select,input{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);text-wrap:balance;line-height:1.35;margin:0}
h1{font-size:28px;font-weight:900}
h2{font-size:21px}
h3{font-size:17px}
.muted{color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
section.view{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;padding-top:24px}
section.view>*{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{text-decoration:none;display:inline-block;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.small{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.label{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700}
/* dashboard */
.hero{display:grid;gap:8px}
.countdown{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.countdown .big{font-family:var(--mono);font-size:44px;font-weight:700;line-height:1;color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.stat h3{margin-bottom:10px}
.meter{height:8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin-top:10px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted);letter-spacing:.06em}
td.r,th.r{text-align:right}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.pill.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.pill.mk{color:var(--mark);border-color:var(--mark);background:var(--mark-soft)}
/* setup form */
.form{display:grid;gap:16px}
.field{display:grid;gap:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:4px 12px;cursor:pointer;background:var(--surface);font-size:14px}
.chips input{accent-color:var(--accent);margin:0}
.chips label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
/* question */
.qhead{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.qno{font-family:var(--mono);font-weight:700;color:var(--ink);font-size:14px}
.stem{white-space:pre-wrap;font-size:16.5px;line-height:1.8;margin:14px 0 18px;max-width:68ch}
.opts{display:grid;gap:10px}
.opt{user-select:text;-webkit-user-select:text;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer;line-height:1.65}
.opt:hover:not([aria-disabled="true"]){border-color:var(--accent)}
.opt[aria-disabled="true"]{cursor:text}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bub{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:13px;color:var(--muted);margin-top:-2px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .bub{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .bub{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.verdict{margin-top:16px;border-radius:10px;padding:12px 16px;border:1px solid var(--line);background:var(--surface2)}
.verdict b.okt{color:var(--ok)} .verdict b.badt{color:var(--bad)}
.verdict p{margin:6px 0 0;white-space:pre-wrap}
.qnav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px}
.progress{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
.progress .meter{flex:1;min-width:120px}
.star{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:2px 10px;cursor:pointer;font-size:13px}
.star[aria-pressed="true"]{color:var(--mark);border-color:var(--mark);background:var(--mark-soft)}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted)}
/* mock */
.timer{font-family:var(--mono);font-weight:700;font-size:22px}
.timer.low{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.grid button{border:1px solid var(--line);background:var(--surface);border-radius:6px;height:34px;font-family:var(--mono);font-size:13px;cursor:pointer;color:var(--muted)}
.grid button.done{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
.grid button.cur{outline:2px solid var(--ink);outline-offset:1px}
.grid button.r{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid button.w{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score .big{font-family:var(--mono);font-size:56px;font-weight:700;line-height:1}
.confirm{border:1px solid var(--bad);background:var(--bad-soft);border-radius:10px;padding:12px 16px}
/* list */
.list{display:grid;gap:12px}
.item{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--surface)}
.item .stem{font-size:15px;margin:8px 0}
.item ol{margin:0;padding-left:0;list-style:none;display:grid;gap:4px;font-size:14px}
.item li.c{color:var(--ok);font-weight:700}
.item li.y{color:var(--bad)}
.item li .wpn{font-size:12px;font-weight:700;white-space:nowrap}
/* notes */
.notes{display:grid;gap:14px}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0}
details.sec>summary{cursor:pointer;padding:16px 20px;list-style:none;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary h2{font-size:18px}
details.sec>summary .secno{font-family:var(--mono);color:var(--accent);font-weight:700;margin-right:10px}
.srcl{margin-top:8px;font-size:13px;color:var(--muted)}
.srcl a{color:var(--accent)}
.secbody{padding:0 20px 20px;display:grid;gap:18px}
.topic h3{font-size:15.5px;margin-bottom:6px}
.topic ul{margin:0;padding-left:1.2em;display:grid;gap:4px;max-width:70ch}
.topic li::marker{color:var(--accent)}
.gate{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;place-items:center;padding-inline:16px}
.gatebox{max-width:420px;width:100%;display:grid;gap:14px;text-align:left}
.gatebox h1{font-size:26px}
.gbtn{display:inline-flex;align-items:center;gap:10px;justify-content:center;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 18px;font-weight:500;cursor:pointer}
.gbtn:hover{border-color:var(--accent)}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
@media (max-width:520px){.who .whoname{display:none}}
.who img{width:24px;height:24px;border-radius:50%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:14px;z-index:20}
.src{font-size:13px;color:var(--muted)}
.src a{color:var(--accent)}
@media (max-width:520px){.kbdhint{display:none}h1{font-size:23px}.countdown .big{font-size:36px}.stem{font-size:16px}.panel{padding:16px}nav.tabs{margin-left:0}}
@media (prefers-reduced-motion:no-preference){.opt,.btn{transition:background .12s,border-color .12s}}
</style>

</head>
<body>
<header class="top"><div class="topin">
  <div class="brand">iPAS 初級刷題室<small>AI 應用規劃師</small></div>
  <nav class="tabs" id="tabs">
    <button data-v="home">總覽</button><button data-v="practice">練習</button><button data-v="mock">模擬考</button><button data-v="wrong">錯題本</button><button data-v="notes">重點整理</button>
  </nav>
  <div class="who" id="who" hidden></div>
</div></header>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>

<div class="gate" id="gate">
  <div class="gatebox">
    <div class="label">iPAS AI 應用規劃師 · 初級</div>
    <h1>iPAS 初級刷題室</h1>
    <p class="muted" id="gatemsg" style="margin:0">正在確認登入狀態…</p>
    <div id="gsignin"></div>
    <div><button class="gbtn" id="gsignout" hidden>換一個帳號</button></div>
  </div>
</div>
<script src="https://accounts.google.com/gsi/client" async></script>
<script>
/* ===== 設定：Google OAuth 用戶端 ID 與允許登入的帳號 ===== */
window.GOOGLE_CLIENT_ID = __GOOGLE_CLIENT_ID__;
window.ALLOWED_EMAILS = __ALLOWED_EMAILS__;
</script>
<script id="bank" type="application/json">__BANK__</script>
<script id="notesdata" type="application/json">__NOTES__</script>
<script>
(function(){
const BANK=JSON.parse(document.getElementById('bank').textContent);
const NOTES=JSON.parse(document.getElementById('notesdata').textContent);
const BYID=Object.fromEntries(BANK.map(q=>[q.id,q]));
const SESS=[['114-4','114 年第四次'],['115-1','115 年第一次'],['115-2','115 年第二次'],['115-3','115 年第三次']];
const SESSNAME=Object.fromEntries(SESS);
const SUBJ={1:'科目一 人工智慧基礎概論',2:'科目二 生成式 AI 應用與規劃'};
const SUBJS={1:'科目一',2:'科目二'};
const L='ABCD';
const EXAM_DATE=new Date('2026-11-07T08:00:00+08:00');
const KEY='ipas-aiap-v1';
let S={ans:{},wrong:[],star:[],mocks:[]};
try{const r=localStorage.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r));}catch(e){}
function save(){S.updated=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} if(window.__drivePush) window.__drivePush();}
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,1800)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function srcLinks(q){
  if(!q.pdf) return '';
  const u=(pg)=>esc(q.pdf)+(pg?'#page='+pg:'');
  const a=`<a href="${u(q.page)}" target="_blank" rel="noopener">${q.src==='exam'?'官方公告試題 PDF':'學習指引 PDF'} 第 ${q.page} 頁</a>`;
  const b=q.src==='guide'&&q.apage?`　<a href="${u(q.apage)}" target="_blank" rel="noopener">官方解析在第 ${q.apage} 頁</a>`:'';
  return `<div class="srcl">出處：${a}${b}</div>`;
}
function metaOf(q){return q.src==='exam'?`${SESSNAME[q.sess]} · ${SUBJS[q.subj]} · 第 ${q.n} 題`:`學習指引 ${SUBJS[q.subj]} ${q.sec} ${q.secname} · 練習 ${q.n}`}
function isRight(q,i){return q.a.includes(L[i])}
function record(q,i){
  const ok=isRight(q,i); const r=S.ans[q.id]||{c:0,w:0};
  ok?r.c++:r.w++; r.last=ok; r.t=Date.now();
  if(!ok){ r.wp=r.wp||{}; r.wp[L[i]]=(r.wp[L[i]]||0)+1; r.lp=L[i]; }
  S.ans[q.id]=r;
  if(!ok) markWrong(q.id,true);
  save(); return ok;
}
function wrongPicks(q){ const r=S.ans[q.id]; return r&&r.wp?r.wp:{}; }
function wpText(q){ const w=wrongPicks(q); const k=Object.keys(w).sort(); return k.length?k.map(x=>`${x}×${w[x]}`).join('、'):''; }
function wpLine(q){ const s=wpText(q); return s?`<div class="srcl">你選錯過的選項：<b style="color:var(--bad)">${s}</b></div>`:''; }
/* 錯題、收藏都記下「何時加入／移除」，跨裝置合併時以最新的動作為準 */
function markWrong(id,on){ S.wm=S.wm||{}; S.wm[id]=[on?1:0,Date.now()]; S.wrong=S.wrong.filter(x=>x!==id); if(on) S.wrong.push(id); }
function markStar(id,on){ S.sm=S.sm||{}; S.sm[id]=[on?1:0,Date.now()]; S.star=S.star.filter(x=>x!==id); if(on) S.star.push(id); }
function removeWrong(id){markWrong(id,false);save()}
function toggleStar(id){markStar(id,!S.star.includes(id));save()}

/* ---------- routing ---------- */
let view='home'; let session=null; let mock=null; let timerId=null;
function go(v){view=v; document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===v)); render(); window.scrollTo(0,0);}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return; if(mock&&!mock.done&&b.dataset.v!=='mock'){toast('模擬考進行中，交卷後才能切換');return} go(b.dataset.v)});
function render(){({home:rHome,practice:rPractice,mock:rMock,wrong:rWrong,notes:rNotes})[view]()}

/* ---------- home ---------- */
function statsFor(filter){
  const qs=BANK.filter(filter); let done=0,right=0;
  qs.forEach(q=>{const r=S.ans[q.id]; if(r){done++; if(r.last) right++;}});
  return {n:qs.length,done,right,pct:done?Math.round(right/done*100):null};
}
function rHome(){
  const days=Math.ceil((EXAM_DATE-new Date())/864e5);
  const s1=statsFor(q=>q.subj===1), s2=statsFor(q=>q.subj===2);
  const card=(t,s,k)=>`<div class="panel stat"><h3>${t}</h3>
    <div class="meter" aria-label="完成度"><i style="width:${s.n?s.done/s.n*100:0}%"></i></div>
    <dl class="kv"><dt>題庫</dt><dd class="num">${s.n} 題</dd><dt>已作答</dt><dd class="num">${s.done}</dd><dt>最近一次答對率</dt><dd class="num">${s.pct===null?'—':s.pct+'%'}</dd></dl>
    <div class="row" style="margin-top:14px"><button class="btn primary small" data-quick="${k}">練這科未作答的題</button></div></div>`;
  const rows=SESS.map(([k,n])=>{const a=statsFor(q=>q.src==='exam'&&q.sess===k&&q.subj===1),b=statsFor(q=>q.src==='exam'&&q.sess===k&&q.subj===2);
    const c=s=>`<td class="r num">${s.done}/${s.n}</td><td class="r num">${s.pct===null?'—':s.pct+'%'}</td>`;
    return `<tr><td>${n}</td>${c(a)}${c(b)}</tr>`}).join('');
  const g1=statsFor(q=>q.src==='guide'&&q.subj===1),g2=statsFor(q=>q.src==='guide'&&q.subj===2);
  const mocks=S.mocks.slice(-5).reverse().map(m=>`<tr><td class="num">${new Date(m.t).toLocaleDateString('zh-TW')}</td><td>${SUBJS[m.subj]||'兩科混合'}</td><td class="r num">${m.right}/${m.n}</td><td class="r num">${m.score}</td><td>${m.score>=70?'<span class="pill ok">達 70</span>':m.score>=60?'<span class="pill mk">60–69</span>':'<span class="pill bad">未達 60</span>'}</td></tr>`).join('');
  app.innerHTML=`<section class="view">
   <div class="hero">
     <div class="label">115 年第四次初級考試 · 11 月 7 日（六）</div>

let pcfg={subj:0,srcs:['exam','guide'],sess:SESS.map(x=>x[0]),range:'all',order:'seq'};
function poolOf(c){
  let qs=BANK.filter(q=>(!c.subj||q.subj===c.subj)&&c.srcs.includes(q.src)&&(q.src!=='exam'||c.sess.includes(q.sess))&&(!c.sec||q.sec===c.sec));
  if(c.range==='new') qs=qs.filter(q=>!S.ans[q.id]);
  if(c.range==='wrong') qs=qs.filter(q=>S.wrong.includes(q.id));
  if(c.range==='star') qs=qs.filter(q=>S.star.includes(q.id));
  return c.order==='rand'?shuffle(qs):qs;
}
function rPractice(){ if(session) return rQuestion(); rSetup(); }
function rSetup(){

    <div class="field"><span class="label">題目來源</span><div class="chips">${chk('src','exam','歷屆公告試題',pcfg.srcs.includes('exam'))}${chk('src','guide','學習指引練習題（含解析）',pcfg.srcs.includes('guide'))}</div></div>
    <div class="field"><span class="label">歷屆場次</span><div class="chips">${SESS.map(([k,n])=>chk('sess',k,n,pcfg.sess.includes(k))).join('')}</div></div>
    <div class="field"><span class="label">範圍</span><div class="chips">${chk('range','all','全部',pcfg.range==='all','radio')}${chk('range','new','只做沒寫過的',pcfg.range==='new','radio')}${chk('range','wrong','錯題本',pcfg.range==='wrong','radio')}${chk('range','star','收藏題',pcfg.range==='star','radio')}</div></div>
    <div class="field"><span class="label">順序</span><div class="chips">${chk('order','seq','依題號',pcfg.order==='seq','radio')}${chk('order','rand','隨機打亂',pcfg.order==='rand','radio')}</div></div>

  const f=$('#pf');

  const upd=()=>{const n=poolOf(Object.assign(read(),{order:'seq'})).length;$('#pcount').textContent=`符合條件：${n} 題`;f.querySelector('[type=submit]').disabled=!n};
  f.addEventListener('change',upd); upd();
  f.addEventListener('submit',e=>{e.preventDefault(); startPractice(read())});
}
function startPractice(c){pcfg=Object.assign({},pcfg,c); const qs=poolOf(c); if(!qs.length){toast('沒有符合條件的題目');view='practice';rSetup();return}
  session={ids:qs.map(q=>q.id),i:0,picks:{},right:0,wrongCnt:0,wrongMode:c.range==='wrong',label:c.label||''}; view='practice';
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.v==='practice')); rQuestion(); window.scrollTo(0,0)}
function rQuestion(){
  const s=session, q=BYID[s.ids[s.i]], pick=s.picks[q.id];
  const answered=pick!==undefined;
  const opts=q.o.map((o,i)=>{let cls=''; if(answered){ if(isRight(q,i)) cls='right'; else if(i===pick) cls='wrong';}
    return `<div class="opt ${cls}" role="button" tabindex="${answered?-1:0}" data-i="${i}" aria-disabled="${answered}"><span class="bub">${L[i]}</span><span>${esc(o)}</span></div>`}).join('');
  let verdict='';
  if(answered){const ok=isRight(q,pick);
    verdict=`<div class="verdict"><b class="${ok?'okt':'badt'}">${ok?'答對了':'答錯了'}</b>　正確答案：<b>${q.a.join('、')}</b>
    <p>${q.e?esc(q.e):'<span class="muted">官方公告試題只提供答案，沒有解析。可到「重點整理」複習相關概念。</span>'}</p>${wpLine(q)}${srcLinks(q)}</div>`;}
  const done=Object.keys(s.picks).length;
  app.innerHTML=`<section class="view"><div class="panel">
    <div class="progress"><span class="num">${s.i+1} / ${s.ids.length}</span><div class="meter"><i style="width:${(s.i+1)/s.ids.length*100}%"></i></div><span class="num">✓ ${s.right}　✗ ${s.wrongCnt}</span></div>
    <div class="qhead" style="margin-top:14px"><div class="qmeta"><span class="pill ${q.src==='guide'?'mk':''}">${q.src==='exam'?'歷屆試題':'學習指引'}</span><span>${esc(metaOf(q))}</span></div>
      <button class="star" id="star" aria-pressed="${S.star.includes(q.id)}">${S.star.includes(q.id)?'★ 已收藏':'☆ 收藏'}</button></div>
    <div class="stem">${esc(q.q)}</div>
    <div class="opts" id="opts">${opts}</div>${verdict}
    <div class="qnav"><button class="btn" id="prev" ${s.i===0?'disabled':''}>← 上一題</button>
      <span class="muted kbdhint" style="font-size:12px;align-self:center">鍵盤：<span class="kbd">A</span>–<span class="kbd">D</span> 作答　<span class="kbd">Enter</span> 下一題</span>
      ${s.i<s.ids.length-1?`<button class="btn primary" id="next">下一題 →</button>`:`<button class="btn primary" id="fin">結束練習</button>`}</div>
  </div>
  <div class="row"><button class="btn ghost small" id="quit">回到練習設定</button></div></section>`;
  $('#opts').onclick=e=>{if(String(getSelection())) return; const b=e.target.closest('.opt'); if(!b||b.getAttribute('aria-disabled')==='true')return; answer(+b.dataset.i)};
  $('#opts').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){const b=e.target.closest('.opt'); if(b&&b.getAttribute('aria-disabled')!=='true'){e.preventDefault();e.stopPropagation();answer(+b.dataset.i)}}};
  $('#star').onclick=()=>{toggleStar(q.id);rQuestion()};
  $('#prev').onclick=()=>{s.i--;rQuestion()};
  const nx=$('#next'); if(nx) nx.onclick=()=>{s.i++;rQuestion();window.scrollTo(0,0)};
  const fn=$('#fin'); if(fn) fn.onclick=finishPractice;
  $('#quit').onclick=()=>{session=null;rSetup()};
}
function answer(i){const s=session,q=BYID[s.ids[s.i]]; if(s.picks[q.id]!==undefined)return; s.picks[q.id]=i; const ok=record(q,i);
  ok?s.right++:s.wrongCnt++;
  if(ok&&s.wrongMode&&S.wrong.includes(q.id)){removeWrong(q.id);toast('答對了，已移出錯題本')}
  rQuestion()}
function finishPractice(){const s=session; const n=Object.keys(s.picks).length;

   <div class="score" style="margin:10px 0"><span class="big">${n?Math.round(s.right/n*100):0}%</span><span class="muted">作答 ${n} 題，答對 ${s.right}，答錯 ${s.wrongCnt}</span></div>

document.addEventListener('keydown',e=>{
  if(e.target.matches('input,select,textarea'))return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;   /* 保留 Ctrl/⌘+C 等快捷鍵給瀏覽器 */
  const k=e.key.toUpperCase();
  if(view==='practice'&&session&&$('#opts')){
    const idx=L.indexOf(k)>=0?L.indexOf(k):(['1','2','3','4'].indexOf(k));
    if(idx>=0){answer(idx);e.preventDefault()}
    else if(e.key==='Enter'||e.key==='ArrowRight'){const b=$('#next')||$('#fin'); if(b&&session.picks[session.ids[session.i]]!==undefined){b.click();e.preventDefault()}}
    else if(e.key==='ArrowLeft'){const b=$('#prev'); if(b&&!b.disabled)b.click()}
  } else if(view==='mock'&&mock&&!mock.done&&$('#mopts')){
    const idx=L.indexOf(k)>=0?L.indexOf(k):(['1','2','3','4'].indexOf(k));
    if(idx>=0){mock.picks[mock.i]=idx;rMockQ();e.preventDefault()}
    else if(e.key==='ArrowRight'||e.key==='Enter'){if(mock.i<mock.ids.length-1){mock.i++;rMockQ()}}
    else if(e.key==='ArrowLeft'){if(mock.i>0){mock.i--;rMockQ()}}
  }
});

   <button class="btn primary" id="wgo" ${list.length?'':'disabled'}>重刷錯題（${list.length}）</button></div>
   <div class="list">${list.length?list.map(q=>{const r=S.ans[q.id]||{c:0,w:0};return `<div class="item"><div class="qhead"><div class="qmeta"><span>${esc(metaOf(q))}</span><span class="pill bad">錯 ${r.w} 次</span></div><button class="btn small ghost" data-rm="${q.id}">移出</button></div>
     <div class="stem">${esc(q.q)}</div><ol>${q.o.map((o,i)=>{const n=wrongPicks(q)[L[i]]; return `<li class="${isRight(q,i)?'c':(n?'y':'')}">(${L[i]}) ${esc(o)}${isRight(q,i)?'　✓ 正確答案':''}${n?`<span class="wpn">　✗ 你選過 ${n} 次</span>`:''}</li>`}).join('')}</ol>
     ${q.e?`<details style="margin-top:8px"><summary class="muted" style="cursor:pointer;font-size:13px">看解析</summary><p style="white-space:pre-wrap;font-size:14px;margin:6px 0 0">${esc(q.e)}</p></details>`:''}${srcLinks(q)}</div>`}).join(''):`<div class="panel"><p style="margin:0">目前沒有錯題。去<a href="#" id="topr" style="color:var(--accent)">練習</a>或<a href="#" id="tomk" style="color:var(--accent)">模擬考</a>刷一輪吧。</p></div>`}</div></section>`;
  $('#wf').onchange=e=>{wfilter=+e.target.value;rWrong()};
  $('#wgo').onclick=()=>startPractice({subj:wfilter,srcs:['exam','guide'],sess:SESS.map(x=>x[0]),range:'wrong',order:'rand'});
  app.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{removeWrong(b.dataset.rm);rWrong()});
  const a=$('#topr'); if(a) a.onclick=e=>{e.preventDefault();go('practice')}; const b=$('#tomk'); if(b) b.onclick=e=>{e.preventDefault();go('mock')};
}

/* ---------- notes ---------- */
let nsubj=1;
function rNotes(){
  const secs=NOTES.filter(n=>n.subj===nsubj);
  app.innerHTML=`<section class="view"><div><div class="label">學習指引重點整理</div><h1>${SUBJ[nsubj]}</h1></div>
   <div class="chips" id="ns">${[1,2].map(v=>`<label><input type="radio" name="ns" value="${v}" ${nsubj===v?'checked':''}>${SUBJ[v]}</label>`).join('')}</div>
   <div class="notes">${secs.map((s,k)=>{const n=BANK.filter(q=>q.src==='guide'&&q.subj===s.subj&&q.sec===s.sec).length;
     return `<details class="sec" ${k===0?'open':''}><summary><h2><span class="secno">${s.sec}</span>${esc(s.title)}</h2><span class="muted" style="font-size:13px">${s.topics.length} 個主題 · ${n} 題練習</span></summary>
     <div class="secbody">${s.topics.map(t=>`<div class="topic"><h3>${esc(t.h)}</h3><ul>${t.pts.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`).join('')}
     <div class="row"><button class="btn small primary" data-sec="${s.sec}" data-subj="${s.subj}">練本節的 ${n} 題練習題</button>${s.pdf?`<a class="btn small" href="${esc(s.pdf)}#page=${s.page}" target="_blank" rel="noopener">看學習指引原文（第 ${s.page} 頁起）</a>`:''}</div></div></details>`}).join('')}</div>
   <p class="src">整理自 iPAS AI 應用規劃師（初級）學習指引科目一、科目二，並依學習指引勘誤表修正（平均差定義、型一／型二錯誤表格、3.2 節練習第 3、7 題）。</p></section>`;
  $('#ns').onchange=e=>{nsubj=+e.target.value;rNotes()};
  app.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>startPractice({subj:+b.dataset.subj,srcs:['guide'],sess:[],sec:b.dataset.sec,range:'all',order:'seq'}));
}

/* ---------- Google 登入（OAuth）＋ 雲端硬碟自動同步 ---------- */
(function initAuth(){
  const gate=$('#gate'),msg=$('#gatemsg'),box=$('#gsignin'),bout=$('#gsignout'),who=$('#who');
  const CID=window.GOOGLE_CLIENT_ID, allowed=(window.ALLOWED_EMAILS||[]).map(e=>e.toLowerCase());
  const SKEY='ipas-aiap-session', TKEY='ipas-aiap-drive-token', DAYS=30;
  const FNAME='ipas-aiap-progress.json';
  const SCOPES='openid email profile https://www.googleapis.com/auth/drive.appdata';
  let started=false;
  function start(){ if(!started){started=true; go('home');} }
  if(!CID){ gate.hidden=true; start(); return; }

  function readSession(){ try{ const s=JSON.parse(localStorage.getItem(SKEY)||'null'); if(s&&s.exp>Date.now()&&allowed.includes(s.email)) return s; }catch(e){} return null; }
  function readToken(email){ try{ const t=JSON.parse(localStorage.getItem(TKEY)||'null'); if(t&&t.exp>Date.now()+60000&&t.email===email) return t.token; }catch(e){} return null; }
  function saveToken(tok,email,sec){ try{ localStorage.setItem(TKEY,JSON.stringify({token:tok,email,exp:Date.now()+(sec||3600)*1000})) }catch(e){} }
  function mergeState(a,b){
    /* 「清除所有紀錄」之後，較舊的那一份不再合併回來 */
    const ra=a.resetAt||0, rb=b.resetAt||0;
    if(ra>(b.updated||0)) b={}; if(rb>(a.updated||0)) a={};
    const out={ans:{},wrong:[],star:[],mocks:[],resetAt:Math.max(ra,rb)};
    const ids=new Set([...Object.keys(a.ans||{}),...Object.keys(b.ans||{})]);
    ids.forEach(id=>{const x=(a.ans||{})[id],y=(b.ans||{})[id]; if(!x||!y){out.ans[id]=x||y;return}
      const m=Object.assign({},(x.t||0)>=(y.t||0)?x:y); const wp={}; [x.wp||{},y.wp||{}].forEach(o=>Object.keys(o).forEach(k=>wp[k]=Math.max(wp[k]||0,o[k])));
      if(Object.keys(wp).length) m.wp=wp; m.c=Math.max(x.c||0,y.c||0); m.w=Math.max(x.w||0,y.w||0); out.ans[id]=m;});
    const mergeSet=(listKey,mapKey)=>{
      const ma=a[mapKey]||{}, mb=b[mapKey]||{}, map={};
      new Set([...Object.keys(ma),...Object.keys(mb)]).forEach(id=>{const x=ma[id],y=mb[id]; map[id]=!x?y:!y?x:(x[1]>=y[1]?x:y)});
      const list=[]; const seen=new Set();
      [...(a[listKey]||[]),...(b[listKey]||[])].forEach(id=>{ if(seen.has(id))return; seen.add(id); if(!map[id]||map[id][0]) list.push(id); });
      Object.keys(map).forEach(id=>{ if(map[id][0]&&!seen.has(id)){ seen.add(id); list.push(id);} });
      out[listKey]=list; out[mapKey]=map;
    };
    mergeSet('wrong','wm'); mergeSet('star','sm');
    const seen=new Set(); [...(a.mocks||[]),...(b.mocks||[])].sort((p,q)=>p.t-q.t).forEach(m=>{if(!seen.has(m.t)){seen.add(m.t);out.mocks.push(m)}});
    out.updated=Math.max(a.updated||0,b.updated||0); return out;
  }
  function gisReady(cb,n=0){ if(window.google&&google.accounts&&google.accounts.oauth2) cb(); else if(n<100) setTimeout(()=>gisReady(cb,n+1),100); else msg.textContent='無法載入 Google 登入元件，請檢查網路或關閉阻擋器後重新整理。'; }

  /* 一個 token client 同時負責登入與雲端硬碟授權；callback 依情境交給 pending */
  let tokenClient=null, pending=null;
  function getClient(){
    if(!tokenClient) tokenClient=google.accounts.oauth2.initTokenClient({client_id:CID,scope:SCOPES,callback:resp=>{const f=pending;pending=null;f&&f(resp)},error_callback:err=>{const f=pending;pending=null;f&&f({error:err&&err.type||'popup_failed'})}});
    return tokenClient;
  }
  function requestToken(opts,cb){ pending=cb; getClient().requestAccessToken(opts); }

  /* ----- 登入畫面 ----- */
  function showLogin(text){
    gate.hidden=false; who.hidden=true; msg.textContent=text;
    box.innerHTML='<button class="gbtn" id="gbtn"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.7 6c4.5-4.2 6.9-10.3 6.9-17.7z"/><path fill="#FBBC05" d="M10.6 28.6A14.6 14.6 0 0 1 9.5 24c0-1.6.3-3.2.8-4.6l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.7l8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.7-6c-2.1 1.4-4.9 2.3-8.2 2.3-6.2 0-11.5-4.1-13.4-9.9l-8 6.1C6.6 42.6 14.6 48 24 48z"/></svg>使用 Google 帳號登入</button>';
    $('#gbtn').onclick=()=>gisReady(()=>requestToken({prompt:'consent'},onLoginToken));
  }
  async function onLoginToken(resp){
    if(!resp||resp.error||!resp.access_token){ msg.textContent='登入沒有完成，請再試一次。'; return; }
    msg.textContent='登入中…';
    let u; try{ u=await (await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+resp.access_token}})).json(); }catch(e){ msg.textContent='無法取得帳號資料，請再試一次。'; return; }
    const email=(u.email||'').toLowerCase();
    if(!u.email_verified||!allowed.includes(email)){ msg.textContent=(u.email||'這個帳號')+' 沒有使用權限，請改用已授權的帳號。'; try{google.accounts.oauth2.revoke(resp.access_token,()=>{})}catch(e){} bout.hidden=false; return; }
    const scopesOk=google.accounts.oauth2.hasGrantedAllScopes(resp,'https://www.googleapis.com/auth/drive.appdata');
    const s={email,name:u.name||'',picture:u.picture||'',exp:Date.now()+DAYS*864e5};
    try{localStorage.setItem(SKEY,JSON.stringify(s))}catch(e){}
    if(scopesOk) saveToken(resp.access_token,email,resp.expires_in);
    enter(s, scopesOk?resp.access_token:null);
    if(!scopesOk) toast('沒有勾選雲端硬碟權限，紀錄只會存在這台裝置');
  }
  bout.onclick=()=>{ bout.hidden=true; msg.textContent='請選擇其他 Google 帳號登入。'; };

  /* ----- 登入後 ----- */
  function enter(s,token){
    who.innerHTML=`${s.picture?`<img src="${esc(s.picture)}" alt="" referrerpolicy="no-referrer">`:''}<span class="whoname">${esc(s.email)}</span><button class="btn small ghost" id="syncbtn" title="Google 雲端硬碟同步狀態">☁ 同步中…</button><button class="btn small ghost" id="logout">登出</button>`;
    who.hidden=false; gate.hidden=true;
    $('#logout').onclick=()=>{ if(mock&&!mock.done){toast('模擬考進行中，交卷後再登出');return}
      try{localStorage.removeItem(SKEY);localStorage.removeItem(TKEY)}catch(e){} location.reload(); };
    start(); initDrive(s.email, token||readToken(s.email));
  }

  function initDrive(email,token){
    const btn=$('#syncbtn'); let fileId=null, pushTimer=null, busy=false, again=false, lastSync=0;
    const setBtn=(txt,title)=>{btn.textContent=txt; btn.title=title||txt;};
    async function api(url,opt={}){
      const r=await fetch(url,Object.assign({cache:'no-store'},opt,{headers:Object.assign({Authorization:'Bearer '+token},opt.headers||{})}));
      if(r.status===401||r.status===403){ token=null; try{localStorage.removeItem(TKEY)}catch(e){} throw new Error('auth'); }
      if(!r.ok) throw new Error('http '+r.status);
      return r;
    }
    async function findFile(){
      const q=encodeURIComponent(`name='${FNAME}'`);
      const j=await (await api(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,modifiedTime)&orderBy=modifiedTime desc&pageSize=10`)).json();
      return j.files&&j.files[0]?j.files[0].id:null;
    }
    async function upload(){
      const body=JSON.stringify(S);
      if(fileId){ await api(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body}); return; }
      const bd='ipasb'+Date.now();
      const mp=`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name:FNAME,parents:['appDataFolder']})}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${bd}--`;
      fileId=(await (await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body:mp})).json()).id;
    }
    const okText=()=>setBtn('☁ 已同步','已和 Google 雲端硬碟同步 · '+new Date().toLocaleTimeString('zh-TW')+'（點一下可立即同步）');
    const busyUI=()=>(mock&&!mock.done)||(view==='practice'&&session);
    /* 每次同步都是「先下載雲端 → 合併 → 再上傳」，不會用某台裝置的舊資料蓋掉其他裝置 */
    async function sync(){
      if(!token){ needToken(); return; }
      if(busy){ again=true; return; } busy=true; setBtn('☁ 同步中…');
      try{
        if(!fileId) fileId=await findFile();
        let changed=false;
        if(fileId){ const remote=await (await api(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`)).json().catch(()=>({}));
          const before=JSON.stringify(S); S=mergeState(S,remote||{}); changed=JSON.stringify(S)!==before;
          try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} }
        await upload(); lastSync=Date.now(); okText();
        if(changed&&!busyUI()) render();
      }catch(e){ if(e.message==='auth') needToken(); else setBtn('☁ 同步失敗，點此重試','同步失敗（網路或 Google 暫時無法連線），點一下重試'); }
      busy=false; if(again){ again=false; sync(); }
    }
    window.__drivePush=()=>{ clearTimeout(pushTimer); if(!token){ needToken(); return; } setBtn('☁ 待同步'); pushTimer=setTimeout(sync,1500); };

    /* 授權約 1 小時過期。續期要開 Google 視窗，瀏覽器只允許在「點擊」時開，
       所以：按同步按鈕一定會續期；另外在下一次點擊頁面任何地方時也會自動續期。 */
    let renewing=false, autoRenewArmed=false;
    function renew(){
      if(renewing) return; renewing=true; setBtn('☁ 連線中…');
      setTimeout(()=>{ if(renewing){ renewing=false; if(!token) setBtn('☁ 點此同步','連線逾時，點一下再試'); } },60000);
      gisReady(()=>requestToken({prompt:'',hint:email,login_hint:email},resp=>{
        renewing=false;
        if(resp&&resp.access_token&&google.accounts.oauth2.hasGrantedAllScopes(resp,'https://www.googleapis.com/auth/drive.appdata')){ token=resp.access_token; saveToken(token,email,resp.expires_in); sync(); }
        else setBtn('☁ 點此同步','沒有完成雲端硬碟授權。點一下重新連線（若沒跳出視窗，請允許此網站的彈出式視窗）');
      }));
    }
    function onGesture(e){ if(!autoRenewArmed||token) return; if(e.target&&e.target.closest&&e.target.closest('#syncbtn')) return;
      autoRenewArmed=false; document.removeEventListener('click',onGesture,true); renew(); }
    function needToken(){
      token=null; if(!renewing) setBtn('☁ 點此同步','雲端硬碟授權已過期，點一下重新連線並同步');
      if(!autoRenewArmed){ autoRenewArmed=true; document.addEventListener('click',onGesture,true); }
    }
    btn.onclick=()=>{ if(token) sync(); else renew(); };

    /* 其他裝置的進度：回到這個分頁時、以及每 60 秒自動拉一次 */
    document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&token&&Date.now()-lastSync>10000) sync(); });
    setInterval(()=>{ if(document.visibilityState==='visible'&&token&&!busyUI()) sync(); },60000);
    if(token) sync(); else needToken();
  }


  const sess=readSession(); if(sess){ enter(sess,null); return; }
  showLogin('請用已授權的 Google 帳號登入。登入時一併授權雲端硬碟，作答紀錄會自動同步到你的 Google 雲端硬碟。');
})();
})();
</script>
